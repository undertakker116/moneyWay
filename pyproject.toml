[project]
name = "moneyway-backend"
version = "0.1.0"
description = "FastAPI backend for MoneyWay authentication, cabinet, and payment flow foundations."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.38,<0.39",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.45,<3",
    "alembic>=1.17,<2",
    "aiosqlite>=0.22,<0.23",
    "asyncpg>=0.31,<0.32",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.3,<0.4",
    "email-validator>=2.3,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
