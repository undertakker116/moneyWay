name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneyway
          POSTGRES_PASSWORD: moneyway
          POSTGRES_DB: moneyway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneyway -d moneyway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_NAME: MoneyWay API
      ENVIRONMENT: test
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql://moneyway:moneyway@localhost:5432/moneyway
      SECRET_KEY: ci-only-secret-key-change-in-production
      JWT_ISSUER: moneyway-test
      JWT_AUDIENCE: moneyway-test-clients
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
